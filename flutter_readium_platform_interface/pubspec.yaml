name: flutter_readium_platform_interface
description: >-
  Platform interface for the flutter_readium plugin. Provides shared Dart
  models, the method-channel contract, and the reader API surface used by
  native implementations.
version: 0.4.1
homepage: https://github.com/notalib/flutter_readium
repository: https://github.com/notalib/flutter_readium
issue_tracker: https://github.com/notalib/flutter_readium/issues
topics:
  - readium
  - ebook
  - audiobook
  - comic
  - tts

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.44.8"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.18.0
  plugin_platform_interface: ^2.1.8
  dartx: ^1.2.0
  dfunc: ^0.10.0
  logging: ^1.3.0
  equatable: ^2.1.0
  collection: ^1.19.1
  crypto: ^3.0.7
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

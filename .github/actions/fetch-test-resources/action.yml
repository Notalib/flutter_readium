name: Fetch test resources
description: >-
  Clone readium-test-resources and build every local test fixture from it —
  both example/assets/pubs/ and the exploded/trimmed example/web/test-*/ fixtures.

runs:
  using: composite
  steps:
    - name: Check out test resources
      uses: actions/checkout@v7
      with:
        repository: Notalib/readium-test-resources
        path: .test-resources

    - name: Build fixtures
      shell: bash
      run: bin/build_test_fixtures .test-resources

    - name: Clean up cloned resources
      shell: bash
      run: rm -rf .test-resources

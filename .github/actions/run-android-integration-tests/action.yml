name: Run Android integration tests
description: >-
  Boot the emulator for one API level and run the example app's integration
  test suite, capturing flutter test output and a pid-scoped logcat on failure.

inputs:
  api-level:
    description: Android API level of the emulator to boot.
    required: true

runs:
  using: composite
  steps:
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: ${{ inputs.api-level }}
        target: google_apis
        arch: x86_64
        profile: pixel_6
        force-avd-creation: false
        # Cold boot every run: a restored snapshot reports boot_completed before its
        # services are up and races the runner's unlock key (upstream #489).
        emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        working-directory: flutter_readium/example
        # logcat is captured inside this action: the emulator is torn down when it
        # ends. Per-line `sh -c` constraints: see ci.instructions.md.
        script: |
          sleep 10
          echo "Android fingerprint:"
          timeout 10s adb shell getprop ro.build.fingerprint || true
          echo "Android ABI:"
          timeout 10s adb shell getprop ro.product.cpu.abi || true
          echo "WebView provider:"
          timeout 10s adb shell dumpsys webviewupdate 2>/dev/null | grep -F "Current WebView package" || true
          # Larger buffer, or `chatty` drops our lines.
          adb logcat -G 64M || true
          adb logcat -c || true
          # Retries once if `adb install` hangs, and stays under the job's time limit.
          bash "${{ github.action_path }}/run-tests.sh" ${{ inputs.api-level }}
          # Which renderer and platform view mode actually ran, e.g. whether HCPP fell back.
          adb logcat -d | grep -E "Impeller rendering backend|platform view rendering strategy|HCPP" | sort -u | head -20 || true

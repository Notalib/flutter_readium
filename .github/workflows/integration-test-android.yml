name: Integration Tests (Android)

on:
  workflow_call:

jobs:
  android:
    name: Android (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 36]

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Read Flutter version
        id: flutter_version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true
          pub-cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter_readium/android/build.gradle', 'flutter_readium/example/android/build.gradle.kts', 'flutter_readium/example/android/app/build.gradle.kts', 'flutter_readium/example/android/gradle/gradle-daemon-jvm.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Build the gitignored webview helper assets so the app under test bundles
      # them (Android injects them into its WebView; see docs/troubleshooting.md).
      - name: Build webview helper assets
        uses: ./.github/actions/build-webview-helpers

      - name: Install Dart dependencies
        run: flutter pub get
        working-directory: flutter_readium/example

      - name: Fetch test resources
        uses: ./.github/actions/fetch-test-resources

      - name: Cache AVD
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Recreate the AVD whenever the emulator setup changes, in either file.
          key: avd-${{ matrix.api-level }}-${{ hashFiles('.github/workflows/integration-test-android.yml', '.github/actions/run-android-integration-tests/action.yml') }}

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Idle before the snapshot is saved on teardown. Taken straight after
          # boot it captures services still starting, and every restore of it
          # then races them.
          script: sleep 60

      - name: Run integration tests
        id: tests
        continue-on-error: true
        uses: ./.github/actions/run-android-integration-tests
        with:
          api-level: ${{ matrix.api-level }}

      # The emulator runner presses the unlock key the moment `sys.boot_completed`
      # flips, which a restored snapshot reports before its services are back; the
      # keypress dies and takes the step with it, before our script ever runs
      # (ReactiveCircus/android-emulator-runner#489). A missing test log means the
      # suite never started, so that is the only case safe to retry — a real test
      # failure always leaves its log behind and must stand.
      - name: Retry integration tests after an emulator boot failure
        id: tests-retry
        if: steps.tests.outcome == 'failure' && hashFiles(format('android-test-api{0}.log', matrix.api-level)) == ''
        uses: ./.github/actions/run-android-integration-tests
        with:
          api-level: ${{ matrix.api-level }}

      - name: Report integration test failure
        if: steps.tests.outcome == 'failure' && steps.tests-retry.outcome != 'success'
        run: exit 1

      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-integration-diagnostics-api${{ matrix.api-level }}
          # Dart record names the failing test; logcat shows the native side.
          path: |
            ${{ github.workspace }}/android-test-api${{ matrix.api-level }}.log
            ${{ github.workspace }}/android-logcat-api${{ matrix.api-level }}.txt
          if-no-files-found: ignore

name: Integration Tests (Web)

on:
  workflow_call:

jobs:

  web:
    name: Web (ChromeDriver)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true # allowed to fail for now

    steps:
      - uses: actions/checkout@v7

      - name: Read Flutter version
        id: flutter_version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true
          pub-cache: true

      - name: Install Dart dependencies
        run: flutter pub get
        working-directory: flutter_readium/example

      # Build the gitignored web navigator bundle (/readiumReader.js) so the web
      # reader's custom element registers; see docs/troubleshooting.md.
      - name: Build web reader bundle
        uses: ./.github/actions/build-web-reader-bundle

      - name: Fetch test resources
        uses: ./.github/actions/fetch-test-resources

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@e913548694400f275b4070efcd90f47dbbc8914c # v3.0.0

      - name: Start ChromeDriver
        run: |
          chromedriver --port=4444 &
          sleep 2

      - name: Run web integration tests
        working-directory: flutter_readium/example
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/plugin_integration_test.dart \
            --dart-define=READIUM_TEST_SKIP_LOGS=true \
            -d chrome

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/instructions/**'
      - '.github/skills/**'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter_version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true
          pub-cache: true

      - name: Install dependencies (platform interface)
        run: flutter pub get
        working-directory: flutter_readium_platform_interface

      - name: Test platform interface
        run: flutter test --coverage
        working-directory: flutter_readium_platform_interface

      - name: Install dependencies (flutter_readium)
        run: flutter pub get
        working-directory: flutter_readium

      - name: Test flutter_readium
        run: flutter test --coverage
        working-directory: flutter_readium

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: |
            flutter_readium_platform_interface/coverage/lcov.info
            flutter_readium/coverage/lcov.info
          fail_ci_if_error: false

  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: flutter_readium/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: flutter_readium

      - name: Run web unit tests
        run: npm test
        working-directory: flutter_readium

  android-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Read Flutter version
        id: flutter_version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true
          pub-cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter_readium/android/build.gradle', 'flutter_readium/example/android/build.gradle.kts', 'flutter_readium/example/android/app/build.gradle.kts', 'flutter_readium/example/android/gradle/gradle-daemon-jvm.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies (flutter_readium)
        run: flutter pub get
        working-directory: flutter_readium

      - name: Install dependencies (example)
        run: flutter pub get
        working-directory: flutter_readium/example

      - name: Run Android unit tests
        run: ./gradlew :flutter_readium:testDebugUnitTest
        working-directory: flutter_readium/example/android

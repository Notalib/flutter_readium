name: Build Web

on:
  workflow_call:

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Read Flutter version
        id: flutter_version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter_readium/example

      # Build the gitignored web navigator bundle (/readiumReader.js) so the web
      # reader's custom element registers; see docs/troubleshooting.md.
      - name: Build web reader bundle
        uses: ./.github/actions/build-web-reader-bundle

      - name: Build web
        run: flutter build web
        working-directory: flutter_readium/example

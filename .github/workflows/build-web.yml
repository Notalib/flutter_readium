name: Build Web

on:
  workflow_call:

jobs:
  build-web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Read Flutter version
        id: flutter_version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter_readium/example

      - name: Build webview helper script
        uses: ./.github/actions/build-webview-helpers

      # Build the gitignored web navigator bundle (/readiumReader.js) so the web
      # reader's custom element registers; see docs/troubleshooting.md.
      - name: Build web reader bundle
        uses: ./.github/actions/build-web-reader-bundle

      - name: Build web
        run: flutter build web
        working-directory: flutter_readium/example

      # Safari 26.2+ and Firefox 147+ can now run Wasm builds. The flag fails the
      # build if any package still uses dart:html, dart:js, dart:js_util or package:js.
      # --web-content-hash renames asset files, so plugin assets must load via the asset manager.
      - name: Build web (Wasm, content-hashed)
        run: flutter build web --wasm --no-deprecated-js-interop --web-content-hash
        working-directory: flutter_readium/example

name: Changelog

# A misnamed fragment would otherwise be found only by bin/release_prep at release time.
on:
  pull_request:
    branches: [main]
    paths:
      - '*/changelog.d/**'
      - 'towncrier.toml'
      - 'bin/changelog'
  workflow_dispatch:

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fragments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Uses the runner's preinstalled pipx; renders the draft into the job log.
      - name: Validate changelog fragments
        run: bin/changelog check

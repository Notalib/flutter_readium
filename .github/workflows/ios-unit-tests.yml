name: iOS Unit Tests

# Give app-hosted unit tests their own runner; XCTest can shut down the simulator.
# Sharing it with integration tests caused:
# https://github.com/Notalib/flutter_readium/actions/runs/28591293702/job/84775289147.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  ios-unit-tests:
    name: iOS (Native Unit Tests)
    # Match the integration job's larger runner for native compilation.
    runs-on: macos-26-xlarge
    timeout-minutes: 30

    env:
      SIMULATOR_DEVICE: iPhone 16e
      SIMULATOR_RUNTIME_VERSION: '26.2'

    steps:
      - uses: actions/checkout@v7

      - name: Read Flutter version
        id: flutter_version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}

      - name: Cache CocoaPods
        uses: actions/cache@v6
        id: pods-cache
        with:
          path: |
            flutter_readium/example/ios/Pods
            ~/.cocoapods
          # The unit job installs the full CocoaPods dependency set.
          key: ios-units-pods-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flutter_readium/example/ios/Podfile.lock', 'flutter_readium/example/ios/Podfile') }}
          restore-keys: |
            ios-units-pods-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Read Xcode build version
        id: xcode_version
        run: |
          xcodebuild -version
          echo "hash=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache iOS unit-test build outputs
        uses: actions/cache@v6
        id: deriveddata-cache
        with:
          path: ~/Library/Developer/Xcode/DerivedData/ReadiumUnitTests
          # Keep unit and integration builds separate. Restore compatible builds
          # across source changes, but never across Xcode, Flutter or dependency changes.
          key: ios-units-deriveddata-v1-macos26-${{ runner.arch }}-xcode${{ steps.xcode_version.outputs.hash }}-flutter${{ steps.flutter_version.outputs.version }}-${{ hashFiles('flutter_readium/example/ios/Podfile.lock', 'flutter_readium/example/ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'flutter_readium/example/ios/Podfile', 'flutter_readium/example/pubspec.lock', 'flutter_readium/ios/flutter_readium.podspec', 'flutter_readium/ios/flutter_readium/Package.swift', 'flutter_readium/**/pubspec.yaml', 'flutter_readium_platform_interface/pubspec.yaml') }}-${{ github.sha }}
          restore-keys: |
            ios-units-deriveddata-v1-macos26-${{ runner.arch }}-xcode${{ steps.xcode_version.outputs.hash }}-flutter${{ steps.flutter_version.outputs.version }}-${{ hashFiles('flutter_readium/example/ios/Podfile.lock', 'flutter_readium/example/ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'flutter_readium/example/ios/Podfile', 'flutter_readium/example/pubspec.lock', 'flutter_readium/ios/flutter_readium.podspec', 'flutter_readium/ios/flutter_readium/Package.swift', 'flutter_readium/**/pubspec.yaml', 'flutter_readium_platform_interface/pubspec.yaml') }}-

      - name: Report unit-test runner and cache status
        run: |
          echo "Runner: $(uname -mrs)"
          echo "CPU cores: $(sysctl -n hw.ncpu)"
          echo "CocoaPods cache hit: ${{ steps.pods-cache.outputs.cache-hit }}"
          echo "Build cache exact hit: ${{ steps.deriveddata-cache.outputs.cache-hit }}"
          du -sh "$HOME/Library/Developer/Xcode/DerivedData/ReadiumUnitTests" 2>/dev/null || true

      # Build the gitignored webview helper assets before the Xcode build:
      # assets/helpers/ is a declared asset dir in flutter_readium/pubspec.yaml,
      # so the Flutter asset-bundling build phase fails outright without it —
      # even though these native unit tests never open a WebView.
      - name: Build webview helper assets
        uses: ./.github/actions/build-webview-helpers

      - name: Install Dart dependencies
        run: flutter pub get
        working-directory: flutter_readium/example

      # assets/pubs/ is a declared asset dir in the example's pubspec.yaml too —
      # gitignored, so the asset-bundling build phase fails without it even
      # though these tests never open a publication.
      - name: Fetch test resources
        uses: ./.github/actions/fetch-test-resources

      - name: Install CocoaPods dependencies
        run: pod install ${{ steps.pods-cache.outputs.cache-hit == 'true' && ' ' || '--repo-update' }}
        working-directory: flutter_readium/example/ios

      - name: Boot iOS simulator
        run: |
          set -euo pipefail

          # Prefer $SIMULATOR_DEVICE on $SIMULATOR_RUNTIME_VERSION; otherwise
          # fall back to the newest available iPhone of any model.
          IFS=$'\t' read -r UDID DEVICE_NAME RUNTIME < <(
            xcrun simctl list devices available --json \
              | jq -r --arg want "$SIMULATOR_DEVICE" --arg wantVersion "$SIMULATOR_RUNTIME_VERSION" '
                  [ .devices | to_entries[]
                    | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS"))
                    | .key as $rt | .value[]
                    | select(.name | startswith("iPhone"))
                    | {name: .name, udid: .udid, rt: $rt,
                       ver: ($rt | capture("iOS-(?<a>[0-9]+)-(?<b>[0-9]+)")
                                 | [(.a | tonumber), (.b | tonumber)])} ] as $all
                  | ( ( [ $all[] | select(.name == $want and (.ver | join(".") == $wantVersion)) ] | first )
                      // ( $all | sort_by(.ver) | last ) )
                  | "\(.udid)\t\(.name)\t\(.rt)"'
          )

          if [ -z "${UDID:-}" ]; then
            echo "::error::No available iPhone simulator found"; exit 1
          fi
          echo "Selected simulator: $DEVICE_NAME ($RUNTIME) -> $UDID"

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run iOS native unit tests
        # Leave time for setup and diagnostics outside this bounded test step.
        # Keep build and launch output: -quiet hid the phase of the first CI timeout.
        # Pin the host architecture to avoid a Rosetta simulator build.
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/ReadiumUnitTests" \
            -only-testing:RunnerTests \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID,arch=$(uname -m)" \
            -resultBundlePath "$RUNNER_TEMP/ios-unit-tests.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/ios-unit-tests.log"
        working-directory: flutter_readium/example/ios

      - name: Upload iOS unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-unit-test-results
          path: |
            ${{ runner.temp }}/ios-unit-tests.log
            ${{ runner.temp }}/ios-unit-tests.xcresult
          if-no-files-found: ignore

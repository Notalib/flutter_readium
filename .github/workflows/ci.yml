name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ios: ${{ steps.baseline.outputs.force == 'true' || steps.filter.outputs.ios == 'true' || steps.filter.outputs.dart == 'true' || steps.filter.outputs.ci == 'true' }}
      android: ${{ steps.baseline.outputs.force == 'true' || steps.filter.outputs.android == 'true' || steps.filter.outputs.dart == 'true' || steps.filter.outputs.ci == 'true' }}
      web: ${{ steps.baseline.outputs.force == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.dart == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test CI baseline selection
        run: node --test .github/scripts/ci-baseline.test.cjs

      - name: Find successful CI baseline
        id: baseline
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const plan = await require('./.github/scripts/ci-baseline.cjs')({ github, context, core });
            for (const [key, value] of Object.entries(plan)) core.setOutput(key, value);
            await core.summary.addHeading('Platform change detection').addRaw(plan.reason).write();
            require('node:fs').writeFileSync(`${process.env.RUNNER_TEMP}/ci-context.json`, JSON.stringify({
              head: context.payload.pull_request?.head.sha, base: context.payload.pull_request?.base.sha,
            }));

      - name: Record tested PR base
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-baseline-v1-pr-${{ github.event.number }}-base-${{ github.event.pull_request.base.sha }}
          path: ${{ runner.temp }}/ci-context.json
          retention-days: 7
          overwrite: true

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: steps.baseline.outputs.force != 'true'
        with:
          token: ''
          base: ${{ steps.baseline.outputs.base }}
          ref: ${{ steps.baseline.outputs.ref }}
          filters: |
            dart:
              - '**/*.dart'
              - '**/pubspec.yaml'
              - '**/pubspec.lock'
              - '**/pubspec_overrides.yaml'
              - '.flutter-version'
              - 'flutter_readium/assets/_helper_scripts/**'
            ios:
              - 'flutter_readium/ios/**'
              - 'flutter_readium/example/ios/**'
            android:
              - 'flutter_readium/android/**'
              - 'flutter_readium/example/android/**'
            web:
              - 'flutter_readium/web/**'
              - 'flutter_readium/example/web/**'
              - 'flutter_readium/package.json'
              - 'flutter_readium/package-lock.json'
            ci:
              - '.github/scripts/ci-baseline*'
              - '.github/actions/**'
              - 'bin/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/test.yml'
              - '.github/workflows/build-android.yml'
              - '.github/workflows/build-ios.yml'
              - '.github/workflows/build-web.yml'
              - '.github/workflows/integration-test-ios.yml'
              - '.github/workflows/integration-test-android.yml'
              - '.github/workflows/integration-test-web.yml'

  # Standalone release builds run only on main. Integration jobs stay independent:
  # they build target-specific debug applications and cannot reuse these artifacts.
  build-ios:
    name: Build iOS
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/build-ios.yml

  build-android:
    name: Build Android
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/build-android.yml

  build-web:
    name: Build Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/build-web.yml

  integration-ios:
    name: Integration Tests iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/integration-test-ios.yml

  unit-tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.android == 'true' || needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/test.yml
    with:
      ios: ${{ needs.changes.outputs.ios == 'true' }}
      android: ${{ needs.changes.outputs.android == 'true' }}
      web: ${{ needs.changes.outputs.web == 'true' }}

  integration-android:
    name: Integration Tests Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/integration-test-android.yml

  integration-web:
    name: Integration Tests Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/integration-test-web.yml

  result:
    name: CI result
    if: always()
    needs: [changes, build-ios, build-android, build-web, unit-tests, integration-ios, integration-android, integration-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          JOB_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test "$CHANGE_RESULT" = success
          case ",$JOB_RESULTS," in
            *,failure,*|*,cancelled,*) exit 1 ;;
          esac

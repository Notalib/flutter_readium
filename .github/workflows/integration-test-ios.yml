name: Integration Tests (iOS)

on:
  workflow_call:

jobs:
  ios:
    name: iOS (Simulator)
    # Pinned to macos-26 (Arm64, GA) rather than macos-latest: the latest alias
    # can lag behind the newest image, and we need the iOS 26 runtime that ships
    # the pinned SIMULATOR_DEVICE below.
    runs-on: macos-26
    timeout-minutes: 45

    env:
      # Pin the simulator model/runtime for run-to-run determinism and faster
      # hosted-runner boots. The macos-26-arm64 image includes iPhone 16e only on
      # the iOS 26.2 runtime, which is the smallest/newest-enough iPhone target
      # listed in the runner image README. Selection still falls back to the
      # newest available iPhone if this exact pairing disappears.
      SIMULATOR_DEVICE: iPhone 16e
      SIMULATOR_RUNTIME_VERSION: '26.2'

    steps:
      - uses: actions/checkout@v7

      - name: Read Flutter version
        id: flutter_version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v6
        id: pods-cache
        with:
          path: |
            flutter_readium/example/ios/Pods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('flutter_readium/example/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Cache Xcode derived data
        uses: actions/cache@v6
        id: deriveddata-cache
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          # Keyed on the runner image, not runner.os ("macOS" is identical
          # across macos-15/26): DerivedData is Xcode-version-specific, so a
          # cache from an older image must not be restored onto a newer Xcode.
          # Also hash anything embedded into the built app — the Flutter pin,
          # example deps, and the webview helper sources — so a restored
          # DerivedData can't serve a Runner.app whose flutter_assets are stale.
          key: xcode-deriveddata-macos26-${{ hashFiles('.flutter-version', 'flutter_readium/example/ios/Podfile.lock', 'flutter_readium/example/pubspec.lock', 'flutter_readium/assets/_helper_scripts/src/**') }}
          restore-keys: |
            xcode-deriveddata-macos26-

      # Diagnostic: the dominant iOS-CI time sinks are cold caches (full pod install
      # + full Xcode rebuild) and underpowered runners. Surface both up front so a
      # slow run can be attributed to a cache miss vs. a genuinely slow build.
      - name: Report runner environment & cache status
        run: |
          echo "Runner:                $(uname -mrs)"
          echo "CPU cores:             $(sysctl -n hw.ncpu)"
          echo "RAM:                   $(( $(sysctl -n hw.memsize) / 1073741824 )) GiB"
          echo "Disk free (/):         $(df -h / | tail -1 | awk '{print $4}')"
          echo "Xcode:                 $(xcodebuild -version | tr '\n' ' ')"
          echo "CocoaPods cache hit:   ${{ steps.pods-cache.outputs.cache-hit }}"
          echo "DerivedData cache hit: ${{ steps.deriveddata-cache.outputs.cache-hit }}"
          echo "DerivedData restored:  $(du -sh ~/Library/Developer/Xcode/DerivedData 2>/dev/null | cut -f1 || echo none)"

      # Build the gitignored webview helper assets before the Xcode build (inside
      # `flutter test`); without them EPUBReaderView crashes on the first reader
      # mount. See docs/troubleshooting.md.
      - name: Build webview helper assets
        uses: ./.github/actions/build-webview-helpers

      - name: Install Dart dependencies
        run: flutter pub get
        working-directory: flutter_readium/example

      - name: Fetch test resources
        uses: ./.github/actions/fetch-test-resources

      - name: Install CocoaPods dependencies
        run: pod install ${{ steps.pods-cache.outputs.cache-hit == 'true' && ' ' || '--repo-update' }}
        working-directory: flutter_readium/example/ios

      - name: Boot iOS simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available

          # Prefer $SIMULATOR_DEVICE on $SIMULATOR_RUNTIME_VERSION; otherwise
          # fall back to the newest available iPhone of any model.
          # Tab-delimited so device names containing spaces survive `read`.
          IFS=$'\t' read -r UDID DEVICE_NAME RUNTIME < <(
            xcrun simctl list devices available --json \
              | jq -r --arg want "$SIMULATOR_DEVICE" --arg wantVersion "$SIMULATOR_RUNTIME_VERSION" '
                  [ .devices | to_entries[]
                    | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS"))
                    | .key as $rt | .value[]
                    | select(.name | startswith("iPhone"))
                    | {name: .name, udid: .udid, rt: $rt,
                       ver: ($rt | capture("iOS-(?<a>[0-9]+)-(?<b>[0-9]+)")
                                 | [(.a | tonumber), (.b | tonumber)])} ] as $all
                  | ( ( [ $all[] | select(.name == $want and (.ver | join(".") == $wantVersion)) ] | first )
                      // ( $all | sort_by(.ver) | last ) )
                  | "\(.udid)\t\(.name)\t\(.rt)"'
          )

          if [ -z "${UDID:-}" ]; then
            echo "::error::No available iPhone simulator found"; exit 1
          fi
          if [ "$DEVICE_NAME" != "$SIMULATOR_DEVICE" ] || [[ "$RUNTIME" != *"iOS-${SIMULATOR_RUNTIME_VERSION/./-}" ]]; then
            echo "::warning::Pinned simulator '$SIMULATOR_DEVICE' on iOS $SIMULATOR_RUNTIME_VERSION unavailable; fell back to '$DEVICE_NAME' ($RUNTIME)"
          fi
          echo "Selected simulator: $DEVICE_NAME ($RUNTIME) -> $UDID"

          # Boot and wait for full boot (SpringBoard up) so the first EPUB open
          # isn't racing a half-warm simulator — cold first-WKWebView is the
          # slowest, flakiest case.
          boot_start=$SECONDS
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "Simulator boot + full-boot wait took $(( SECONDS - boot_start ))s"
          echo "IOS_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run integration tests
        # Force the `expanded` reporter. In CI, package:test auto-selects its
        # GitHub Actions reporter (GITHUB_ACTIONS=true), which rendered a real
        # native crash as a misleading "2 tests passed" tally + exit 1 with no
        # visible failure. `expanded` reports per-test status honestly (incl.
        # "did not complete"), which is how the EPUBReaderView asset crash was
        # found — keep it so future native crashes stay legible in CI logs.
        # Run the single aggregator entrypoint, not the folder glob: each
        # groups/*_test.dart is its own build target (flutter/flutter#115751), so
        # the glob would rebuild the app per suite.
        run: flutter test integration_test/plugin_integration_test.dart --reporter expanded --device-id="$IOS_SIMULATOR_UDID"
        working-directory: flutter_readium/example

      # Diagnostic: confirm the integration build ran the host-native arch and not
      # the x86_64/Rosetta slice (a suspected cause of slow runs). Reports the host
      # arch, the simulator's default arch, and the arch(es) actually compiled into
      # the Runner.app that ran. Purely informational — never fails the job.
      - name: Report integration build architecture
        if: always()
        # Informational only — must never fail the job (runs under bash -eo pipefail),
        # hence the trailing `|| true`. Filters to simulator builds; the iphoneos
        # (device) Runner.app is irrelevant to the integration run.
        run: |
          echo "Host arch:            $(uname -m)"
          echo "Simulator spawn arch: $(xcrun simctl spawn "$IOS_SIMULATOR_UDID" arch 2>/dev/null || echo '?')"
          find "$GITHUB_WORKSPACE/flutter_readium/example/build" \
               "$HOME/Library/Developer/Xcode/DerivedData" \
               -type d -name Runner.app 2>/dev/null | while read -r app; do
            case "$app" in *[Ss]imulator*) ;; *) continue ;; esac
            bin="$app/Runner"
            [ -f "$bin" ] && echo "Runner binary arch:   $(lipo -archs "$bin" 2>/dev/null || file -b "$bin")  ($bin)"
          done || true

      - name: Collect iOS crash & simulator diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/ios-diags
          # Runner.app / WebContent (WKWebView) crash reports (.ips)
          cp -R ~/Library/Logs/DiagnosticReports/. /tmp/ios-diags/ 2>/dev/null || true
          xcrun simctl spawn "$IOS_SIMULATOR_UDID" log collect --output /tmp/ios-diags/sim.logarchive 2>/dev/null || true
          ls -lR /tmp/ios-diags || true

      - name: Upload iOS diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-integration-diagnostics
          path: /tmp/ios-diags
          if-no-files-found: ignore
